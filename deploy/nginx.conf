# نمونه تنظیمات Nginx — مسیر: /etc/nginx/sites-available/lawyer-site
server {
    listen 80;
    server_name example.com www.example.com;

    # هدایت به HTTPS پس از نصب گواهی (certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;
    charset utf-8;

    location /static/ {
        alias /var/www/lawyer-site/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/lawyer-site/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/lawyer-site.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
